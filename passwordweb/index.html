<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#176b4d">
    <meta name="api-base-url" content="http://localhost:8000/api/v1">
    <title>Reset password · FarmApp</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #183426;
        background: #f5f8f4;
      }
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        margin: 0;
        padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
        background: radial-gradient(ellipse at top, #e7f1e7 0, transparent 52%), #f5f8f4;
      }
      .card {
        width: min(100%, 460px);
        padding: clamp(22px, 6vw, 38px);
        border: 1px solid #dce7dc;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 20px 60px #18342612;
      }
      .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
      .brand-name { font-size: 14px; font-weight: 800; }
      .brand-caption { margin-top: 3px; color: #65766a; font-size: 12px; }
      .eyebrow { color: #176b4d; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 9px 0 8px; font-size: clamp(25px, 7vw, 32px); line-height: 1.15; letter-spacing: -.035em; }
      p { color: #65766a; line-height: 1.6; }
      .intro { margin: 0 0 22px; font-size: 14px; }
      .field { margin-top: 17px; }
      label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 750; }
      input { width: 100%; min-height: 48px; padding: 12px 14px; border: 1px solid #cbd8cd; border-radius: 12px; background: #fff; color: #183426; font: inherit; font-size: 16px; outline: none; }
      input:focus { border-color: #176b4d; box-shadow: 0 0 0 3px #176b4d1a; }
      .password-wrap { position: relative; }
      .password-wrap input { padding-right: 78px; }
      .toggle { position: absolute; top: 50%; right: 7px; min-height: 38px; padding: 0 9px; transform: translateY(-50%); border: 0; border-radius: 8px; background: transparent; color: #176b4d; font: inherit; font-size: 12px; font-weight: 750; cursor: pointer; }
      .hint { margin: 7px 0 0; color: #65766a; font-size: 12px; }
      .message { display: none; margin: 14px 0; padding: 12px 14px; border: 1px solid #f0d4d4; border-radius: 12px; background: #fff6f6; color: #a33e3e; font-size: 13px; line-height: 1.5; }
      .message.visible { display: block; }
      .message.success { border-color: #cce6d1; background: #e8f4e9; color: #267348; }
      .submit { width: 100%; min-height: 50px; margin-top: 23px; padding: 13px 16px; border: 0; border-radius: 12px; background: #176b4d; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
      .submit:hover { background: #124c39; }
      .submit:disabled { opacity: .65; cursor: wait; }
      .footer { margin: 20px 0 0; text-align: center; font-size: 13px; }
      a { color: #176b4d; font-weight: 750; text-decoration: none; }
      a:hover { text-decoration: underline; }
      .help { margin: 24px 0 0; text-align: center; color: #65766a; font-size: 11px; }
      @media (max-width: 380px) { .card { border-radius: 18px; } .brand { margin-bottom: 23px; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
    </style>
  </head>
  <body>
    <main class="card">
      <header class="brand">
        <div>
          <div class="brand-name">FarmApp</div>
          <div class="brand-caption">Farm management, made simpler</div>
        </div>
      </header>

      <div class="eyebrow">Account security</div>
      <h1 id="heading">Set a new password</h1>
      <p class="intro" id="intro">Create a new password for your account. For your security, this reset link expires after 60 minutes.</p>
      <div class="message" id="message" role="alert"></div>

      <form id="reset-form">
        <div class="field">
          <label for="email">Account email</label>
          <input id="email" name="email" type="email" required autocomplete="email" inputmode="email" autocapitalize="none" spellcheck="false">
        </div>
        <div class="field">
          <label for="password">New password</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" aria-describedby="password-hint">
            <button class="toggle" type="button" data-toggle="password" aria-controls="password" aria-pressed="false">Show</button>
          </div>
          <p class="hint" id="password-hint">Use at least 8 characters.</p>
        </div>
        <div class="field">
          <label for="password_confirmation">Confirm new password</label>
          <div class="password-wrap">
            <input id="password_confirmation" name="password_confirmation" type="password" required minlength="8" autocomplete="new-password">
            <button class="toggle" type="button" data-toggle="password_confirmation" aria-controls="password_confirmation" aria-pressed="false">Show</button>
          </div>
        </div>
        <button class="submit" id="submit" type="submit">Save new password</button>
      </form>
      <p class="footer"><a href="/">Back to FarmApp</a></p>
      <p class="help">If you did not request this change, you can safely ignore this page.</p>
    </main>

    <script>
      const apiBaseUrl = document.querySelector('meta[name="api-base-url"]').content.replace(/\/$/, '');
      const apiUrl = `${apiBaseUrl}/auth/reset-password`;
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token') || '';
      const email = document.getElementById('email');
      const form = document.getElementById('reset-form');
      const message = document.getElementById('message');
      const submit = document.getElementById('submit');

      email.value = params.get('email') || '';
      if (!token || !email.value) {
        message.textContent = 'This password reset link is incomplete. Request a new reset email in the app.';
        message.classList.add('visible');
        form.hidden = true;
      }

      document.querySelectorAll('[data-toggle]').forEach((button) => {
        button.addEventListener('click', () => {
          const input = document.getElementById(button.dataset.toggle);
          const visible = input.type === 'password';
          input.type = visible ? 'text' : 'password';
          button.textContent = visible ? 'Hide' : 'Show';
          button.setAttribute('aria-pressed', String(visible));
        });
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        message.classList.remove('visible', 'success');
        if (form.password.value !== form.password_confirmation.value) {
          message.textContent = 'The password confirmation does not match.';
          message.classList.add('visible');
          return;
        }

        submit.disabled = true;
        submit.textContent = 'Updating password…';
        try {
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({
              token,
              email: email.value.trim(),
              password: form.password.value,
              password_confirmation: form.password_confirmation.value,
            }),
          });
          const result = await response.json();
          if (!response.ok) {
            const errors = Object.values(result.errors || {}).flat();
            throw new Error(errors[0] || result.message || 'Could not reset your password.');
          }

          document.getElementById('heading').textContent = 'Password updated';
          document.getElementById('intro').textContent = result.message;
          form.hidden = true;
          message.classList.remove('visible');
        } catch (error) {
          message.textContent = error instanceof TypeError
            ? 'Could not connect to FarmApp. Check your connection and try again.'
            : error.message;
          message.classList.add('visible');
        } finally {
          submit.disabled = false;
          submit.textContent = 'Save new password';
        }
      });
    </script>
  </body>
</html>
