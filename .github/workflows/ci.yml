name: FarmApp CI

on:
  push:
    branches: [main, "chore/**", "fix/**", "feature/**", "feat/**", "test/**"]
  pull_request:
    branches: [main]

concurrency:
  group: farmapp-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter checks (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [proj, buyer, Drivers, Suppliers, Vetinaries]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: flutter pub get
      - name: Analyze
        working-directory: ${{ matrix.project }}
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Test
        working-directory: ${{ matrix.project }}
        run: flutter test --no-pub

  backend:
    name: Laravel backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, sqlite3, xml, curl, fileinfo
          coverage: none
      - name: Install Composer dependencies
        working-directory: backend/app
        run: composer install --no-interaction --prefer-dist
      - name: Configure test environment
        working-directory: backend/app
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run feature and unit tests
        working-directory: backend/app
        run: php artisan test

  backend-postgres-migrations:
    name: PostgreSQL 17 migration compatibility
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: farmapp_test
          POSTGRES_USER: farmapp
          POSTGRES_PASSWORD: farmapp_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U farmapp -d farmapp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: farmapp_test
      DB_USERNAME: farmapp
      DB_PASSWORD: farmapp_ci_password
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_pgsql, pgsql, xml, curl, fileinfo
          coverage: none
      - name: Install Composer dependencies
        working-directory: backend/app
        run: composer install --no-interaction --prefer-dist
      - name: Configure application key
        working-directory: backend/app
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run all migrations on PostgreSQL
        working-directory: backend/app
        run: php artisan migrate --force --no-interaction
      - name: Confirm migration state
        working-directory: backend/app
        run: php artisan migrate:status

  crm:
    name: CRM production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crm/package-lock.json
      - name: Install dependencies
        working-directory: crm
        run: npm ci
      - name: Build CRM
        working-directory: crm
        run: npm run build

  deployment-config:
    name: Production Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose configuration
        run: |
          cp backend/app/.env.example backend/app/.env
          docker compose \
            -f backend/docker-compose.yml \
            -f backend/docker-compose.production.yml \
            config --quiet
